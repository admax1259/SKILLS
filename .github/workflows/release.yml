name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify release tag and main ancestry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 -c 'import os,pathlib; assert os.environ["RELEASE_TAG"] == "v" + pathlib.Path("VERSION").read_text().strip(), "Tag/version mismatch"'
          git merge-base --is-ancestor HEAD origin/main
      - run: python3 scripts/validate.py
      - run: python3 scripts/catalog.py --check
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/package.py
      - name: Publish immutable release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/packages/*.zip dist/packages/SHA256SUMS --verify-tag --generate-notes
